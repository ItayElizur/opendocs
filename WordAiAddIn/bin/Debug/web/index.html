<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>GenOffice AI - Spike 2</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 0; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }
    h3 { margin: 8px 12px; }
    #transcript { flex: 1; overflow-y: auto; padding: 8px 12px; background: #f7f7f7; }
    .line { margin-bottom: 6px; white-space: pre-wrap; }
    .line.assistant { color: #0b5fff; }
    #inputRow { display: flex; padding: 8px; border-top: 1px solid #ddd; }
    #input { flex: 1; padding: 6px; }
    #sendBtn { padding: 6px 12px; margin-left: 6px; }
  </style>
</head>
<body>
  <h3>GenOffice AI - Spike 2 (AgentLoop + streaming port)</h3>
  <div id="transcript"></div>
  <div id="inputRow">
    <input id="input" type="text" placeholder="Type a message..." />
    <button id="sendBtn">Send</button>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
